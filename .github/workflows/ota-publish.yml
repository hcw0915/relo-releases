name: OTA publish (verified re-promotion)
# Triggered by pushes to this branch from hcw0915/Relo emergency-rollback.yml (write deploy key). See .github/ota/publish.mjs.
on:
  push:
    branches: [ota-publish]
    paths: ['queue/**']
permissions:
  contents: write
concurrency:
  group: ota-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify and upload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          CHANGED="$(git diff --name-only --diff-filter=AM HEAD~1 HEAD 2>/dev/null || git ls-files queue)"
          export CHANGED
          node .github/ota/publish.mjs
